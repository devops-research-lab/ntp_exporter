name: CI
on:
  push: null
permissions:
  contents: read
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
    - name: Check out code
      uses: actions/checkout@v4
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        check-latest: true
        go-version: 1.24.1
    - name: Build all binaries
      run: make build-all
  test:
    name: Test
    needs:
    - build
    runs-on: ubuntu-latest
    steps:
    - name: Check out code
      uses: actions/checkout@v4
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        check-latest: true
        go-version: 1.24.1
    - name: Run tests and generate coverage report
      run: make build/cover.out
